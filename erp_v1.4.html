<style>

const R=(...a)=>`<div class=row>${a.join('')}</div>`;
const inUse=id=>P(id).used||D.recipes.some(r=>r.pid==id||r.lines.some(l=>l.pid==id))||D.orders.some(o=>o.pid==id)||[...D.receipts,...D.writeoffs,...D.sales,...D.porders,...D.returns,...D.corders,...D.creturns].some(d=>d.lines.some(l=>l.pid==id));

cash=sm(D.accounts.map(a=>({v:bal(a)})),'v'),ap=D.receipts.filter(r=>r.status=='Проведён'&&!r.paid).reduce((a,r)=>a+r.total-(r.retSum||0),0),ar=D.sales.filter(r=>r.status=='Проведён'&&!r.paid).reduce((a,r)=>a+Math.max(r.rev-(r.paidSum||0),0),0)+rv();
const k=(a,b,c)=>`<div><span>${a}</span><b class="${c||''}">${b}</b></div>`;
return `<h2>Главное · ${m}</h2><div class=k>${k('Деньги на счетах',fmt(cash)+' ₽',cash<0?'bad':'')}${k('Выручка',fmt(x.rev)+' ₽')}${k('Валовая прибыль',fmt(x.gp)+' ₽')}${k('Чистая прибыль ≈',fmt(x.net)+' ₽',x.net<0?'bad':'ok')}${k('Стоимость запасов',fmt(sm(D.products.map(p=>({v:p.qty*p.avg})),'v'))+' ₽')}${k('Мы должны',fmt(ap)+' ₽')}${k('Нам должны',fmt(ar)+' ₽')}${k('Очередь заказов',q.length+(late.length?` (просрочено ${late.length})`:''),late.length?'bad':'')}</div>
<h3>Внимание</h3><p>${[low.length&&`Ниже мин. остатка: ${low.map(p=>p.name).join(', ')}`,nr.length&&`Изделия без техкарты: ${nr.map(p=>p.name).join(', ')}`,neg.length&&`Отрицательная маржа: ${neg.map(p=>p.name).join(', ')}`,D.porders.some(soon)&&`Скоро поставка: ${D.porders.filter(soon).map(o=>'№'+o.no+' ('+o.due+')').join(', ')}`,D.returns.some(rlate)&&`Ждём деньги по возврату более 7 дней: ${D.returns.filter(rlate).map(r=>'№'+r.no).join(', ')}`,[...D.writeoffs,...D.returns].some(x=>x.ap&&!x.status)&&'Есть документы на утверждении',D.porders.some(od)&&`Просрочены заказы поставщикам: ${D.porders.filter(od).map(o=>'№'+o.no).join(', ')}`,D.corders.some(coo)&&`Просрочены заказы клиентов: ${D.corders.filter(coo).map(o=>'№'+o.no).join(', ')}`,UEn(),!ST().tax&&'Не выбрана система налогообложения (Настройки)'].filter(Boolean).join('<br>')||'Всё в порядке'}</p>`};
V['Товары']=()=>{const f=fl('pr'),q=(f.q||'').toLowerCase(),rows=D.products.filter(p=>!!p.arch==!!f.arch&&(!f.s||p.type==f.s)&&(!f.low||(p.min&&p.qty<p.min))&&(!q||[p.name,p.art,p.code,p.bc].some(x=>String(x||'').toLowerCase().includes(q))));
return `<h2>Товары</h2><button class=p onclick="pf()">+ Добавить</button> <button onclick="pdel()">Удалить выбранные</button> <button onclick="pmass()">Изменить у выбранных</button> <button onclick="parch()">В архив / из архива</button> <label style="display:inline;cursor:pointer" title="Формат: наименование;артикул;тип;ед;закупка;продажа;мин">Импорт CSV<input type=file accept=".csv,.xlsx" style="display:none" onchange="pimp(this.files[0])"></label>
<div class=fb><input placeholder="Наименование / артикул / код / штрихкод" value="${f.q||''}" onchange="fl('pr').q=this.value;go()"><select onchange="fl('pr').s=this.value;go()">${opts([['','Все типы'],...TY],f.s)}</select><label style="display:inline">ниже мин. <input type=checkbox style="display:inline;width:auto" ${f.low?'checked':''} onchange="fl('pr').low=this.checked;go()"></label><label style="display:inline">архив <input type=checkbox style="display:inline;width:auto" ${f.arch?'checked':''} onchange="fl('pr').arch=this.checked;go()"></label></div>`+
tb('tovary',[`<input type=checkbox onclick="document.querySelectorAll('.sel').forEach(c=>c.checked=this.checked)">`,'Наименование','Артикул','Код','Тип','Ед.','Закуп. ₽','Продажа ₽','Остаток','Доступно','Себест. ₽','Маржа %','Мин.'],rows.map(p=>({o:`pf('${p.id}')`,c:[`<input type=checkbox class=sel value=${p.id} onclick="event.stopPropagation()">`,p.name,p.art,p.code,p.type,p.unit,fmt(p.buy),fmt(p.sell),`<b class="${p.min&&p.qty<p.min?'bad':''}">${fmt(p.qty)}</b>`,fmt(p.qty-resv(p.id)),fmt(p.avg),p.sell?fmt((p.sell-p.avg)/p.sell*100):'',fmt(p.min)]})))};
function pf(id){const p=id?P(id):{type:'сырьё',unit:'шт',qty:0,avg:0},

Object.assign(p,{name:g('n'),art:a,code:g('cd'),bc:g('bc'),type:g('t'),unit:g('u'),buy:g('b'),sell:g('s'),min:g('mn'),vat:g('vt'),wt:g('wt'),dm:g('dm'),sp:g('sp'),ds:g('dsc'),ph});
if(g('b')>g('s')&&g('s'))alert('Внимание: закупка выше цены продажи');if(p.type=='сырьё'&&!p.min)alert('Не задан минимальный остаток');put('products',p)},1],
...(id?[[p.arch?'Восстановить':'Архивировать',()=>{p.arch=!p.arch;put('products',p)}]]:[]),...(id&&!inUse(id)?[['Удалить',()=>del('products',id)]]:[])])}
V['Контрагенты']=()=>`<h2>Контрагенты</h2><button class=p onclick="ptf()">+ Добавить</button>`+tb('kontragenty',['Наименование','Тип','ИНН','Телефон','Мы должны ₽','Нам должны ₽'],D.partners.map(p=>({o:`ptf('${p.id}')`,c:[p.name,p.type,p.inn,p.tel,fmt(D.receipts.filter(r=>r.status=='Проведён'&&!r.paid&&r.pt==p.id).reduce((a,r)=>a+r.total-(r.retSum||0),0)),fmt(D.sales.filter(r=>r.status=='Проведён'&&!r.paid&&r.pt==p.id).reduce((a,r)=>a+Math.max(r.rev-(r.paidSum||0),0),0)+rv(p.id))]})));

// receipts
V['Приход']=()=>`<h2>Приход</h2><button class=p onclick="rf()">+ Оприходовать</button> <button onclick="tplNew('receipts')">Из шаблона</button>`+fbar('rc',1,1)+tb('prihod',['№','Дата','Поставщик','Сумма ₽','Оплата','Статус'],fx('rc',D.receipts,ds).map(r=>({o:`rf('${r.id}')`,c:[r.no,r.date,PT(r.pt),fmt(r.total||sm(r.lines,'qty')),r.paid?'оплачено':'в долг',ds(r)]})).reverse());
