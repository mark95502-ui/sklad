/* Section 2.3 — catalogue and item card */
.catalog-overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 18px}
.catalog-kpi{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:17px 18px;min-width:0;box-shadow:0 8px 22px rgba(6,9,25,.035)}
.catalog-kpi-label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);font-weight:650}
.catalog-kpi-label span{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--surface-soft);color:var(--green)}
.catalog-kpi-value{font-size:25px;font-weight:780;letter-spacing:-.7px;margin-top:10px;line-height:1.15}
.catalog-kpi-foot{font-size:11px;color:var(--muted);margin-top:8px}
.catalog-kpi.attention .catalog-kpi-label span{background:var(--amber-soft);color:var(--amber)}
.catalog-panel{overflow:hidden}
.catalog-head{padding:21px 22px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px;border-bottom:1px solid var(--line)}
.catalog-title{font-size:17px;font-weight:760;letter-spacing:-.35px}
.catalog-description{font-size:11px;color:var(--muted);margin-top:6px}
.catalog-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.catalog-filterbar{display:grid;grid-template-columns:minmax(230px,1.6fr) repeat(4,minmax(130px,1fr)) auto;gap:9px;padding:15px 20px;border-bottom:1px solid var(--line);align-items:center}
.catalog-search{min-width:0;width:100%}
.catalog-filterbar .filter-select{width:100%;min-width:0;max-width:none}
.catalog-reset{padding:9px 11px}
.catalog-table-heading{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 21px 11px}
.catalog-result-count{font-size:11px;color:var(--muted)}
.catalog-result-count strong{color:var(--text);font-size:13px;margin-left:4px}
.catalog-table-note{font-size:10px;color:var(--muted);text-align:right}
.catalog-table-scroll{max-height:none}
.catalog-table{min-width:1050px}
.catalog-table th{font-size:9px;letter-spacing:.35px;text-transform:uppercase;white-space:normal;line-height:1.5}
.catalog-table td{padding:13px 12px;vertical-align:middle}
.catalog-product{display:flex;align-items:center;gap:11px;min-width:220px}
.catalog-thumb{width:42px;height:42px;border-radius:11px;flex:0 0 42px;display:grid;place-items:center;background:var(--surface-soft);border:1px solid var(--line);color:var(--green);overflow:hidden}
.catalog-thumb img{width:100%;height:100%;object-fit:cover}
.catalog-product-copy{min-width:0}
.catalog-name{display:block;border:0;background:none;color:var(--text);font-size:12px;font-weight:730;text-align:left;padding:0;line-height:1.45;max-width:320px;white-space:normal}
.catalog-name:hover{color:var(--green);text-decoration:underline;text-underline-offset:3px}
.catalog-sub{font-size:10px;line-height:1.55;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.catalog-sub span{padding:0 2px}
.catalog-barcode{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.catalog-type{display:inline-flex;font-size:10px;font-weight:700;color:var(--text);background:var(--surface-soft);border:1px solid var(--line);border-radius:6px;padding:5px 7px;white-space:nowrap}
.catalog-qty{font-size:13px;font-weight:760;white-space:nowrap}
.catalog-qty span{font-size:10px;font-weight:550;color:var(--muted)}
.catalog-qty.low{color:var(--red)}
.catalog-waiting{color:var(--amber)}
.catalog-price{font-size:12px;font-weight:730;white-space:nowrap}
.catalog-positive{color:var(--green)!important}
.catalog-negative{color:var(--red)!important}
.catalog-muted{font-size:10px;color:var(--muted)}
.catalog-row-low td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.catalog-row-low{background:color-mix(in srgb,var(--red-soft) 14%,transparent)}
.catalog-row-archived{opacity:.64}
.catalog-status{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;white-space:nowrap}
.catalog-status>span{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green-soft) 70%,transparent)}
.catalog-status.archived>span{background:var(--muted);box-shadow:none}
.catalog-actions{gap:4px;flex-wrap:nowrap}
.catalog-actions .icon-btn{width:29px;height:29px;min-width:29px;border-radius:8px}
.catalog-actions .icon-btn svg{width:13px;height:13px}
.catalog-footer{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;padding:12px 21px 15px;border-top:1px solid var(--line);font-size:10px;line-height:1.6;color:var(--muted)}
.catalog-footer span:first-child{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.catalog-footer span:first-child svg{color:var(--green)}
.item-edit-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 17px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.item-edit-section{font-size:10px;font-weight:680;color:var(--muted);padding:7px 10px;border-radius:7px;background:var(--surface-soft)}
.item-edit-section.active{color:var(--green);background:var(--green-soft)}
.item-edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}
.item-edit-grid .field{min-width:0}
.item-edit-grid .field.full{grid-column:1/-1}
#modalBody .field label{display:block;font-size:11px;font-weight:650;color:var(--muted);margin-bottom:7px}
#modalBody .field input,#modalBody .field select,#modalBody .field textarea{width:100%;max-width:100%;min-width:0}
#modalBody .field-hint{font-size:10px;line-height:1.45}
.item-detail-root{margin:-2px -2px 2px}
.item-detail-tabs{display:flex;gap:5px;overflow-x:auto;padding:0 0 13px;margin:0 0 18px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.item-detail-tab{flex:0 0 auto;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:8px;padding:9px 11px;font-size:11px;font-weight:680;white-space:nowrap}
.item-detail-tab:hover{background:var(--surface-soft);color:var(--text)}
.item-detail-tab.active{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 23%,var(--line));color:var(--green)}
.item-detail-content{min-height:260px}
.detail-hero{display:flex;align-items:center;gap:13px;padding:2px 0 18px}
.detail-hero-mark{width:52px;height:52px;flex:0 0 52px;border-radius:14px;display:grid;place-items:center;background:var(--surface-soft);border:1px solid var(--line);color:var(--green)}
.detail-hero-copy{flex:1;min-width:0}
.detail-overline{font-size:10px;color:var(--muted);margin-bottom:5px}
.detail-hero h3{font-size:19px;line-height:1.25;margin:0;font-weight:770;letter-spacing:-.4px;overflow-wrap:anywhere}
.detail-identity{font-size:10px;color:var(--muted);margin-top:7px;overflow-wrap:anywhere}
.detail-identity span{padding:0 4px}
.detail-metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 20px}
.detail-metric{padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:var(--surface-soft);min-width:0}
.detail-metric>span{display:block;font-size:10px;color:var(--muted);line-height:1.4}
.detail-metric strong{display:block;font-size:16px;line-height:1.35;margin-top:7px;letter-spacing:-.2px;overflow-wrap:anywhere}
.detail-metric small{display:block;color:var(--muted);font-size:9px;line-height:1.4;margin-top:5px}
.detail-section{margin-top:17px}
.detail-section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;font-weight:760;margin-bottom:11px}
.detail-section-title span{font-size:10px;color:var(--muted);font-weight:550}
.detail-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:11px;overflow:hidden}
.detail-fields>div{display:flex;flex-direction:column;gap:6px;padding:12px 13px;border-bottom:1px solid var(--line);min-width:0}
.detail-fields>div:nth-child(odd){border-right:1px solid var(--line)}
.detail-fields>div:nth-last-child(-n+2){border-bottom:0}
.detail-fields span,.detail-channel-grid span{font-size:10px;color:var(--muted)}
.detail-fields b{font-size:11px;line-height:1.45;overflow-wrap:anywhere}
.detail-description{font-size:11px;line-height:1.7;color:var(--muted);padding:13px 14px;border:1px solid var(--line);border-radius:10px;overflow-wrap:anywhere}
.detail-channel-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.detail-channel-grid>div{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.detail-channel-grid b{font-size:13px}
.detail-note{font-size:10px;line-height:1.65;color:var(--muted);padding:12px 14px;background:var(--surface-soft);border:1px solid var(--line);border-radius:10px;margin:10px 0 17px}
.detail-mini-table{overflow:auto;border:1px solid var(--line);border-radius:10px}
.detail-mini-table table{min-width:560px;width:100%;border-collapse:collapse}
.detail-mini-table th{font-size:9px;text-transform:none;white-space:nowrap;background:var(--surface-soft)}
.detail-mini-table td{font-size:10px;white-space:normal;vertical-align:middle}
.detail-empty{font-size:11px;color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:10px}
.sub-section-title{margin-top:21px}
.detail-file-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.detail-file-card{border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;overflow:hidden}
.detail-file-card img{width:100%;height:105px;object-fit:cover;border-radius:7px;background:var(--surface-soft)}
.detail-file-icon{height:105px;display:grid;place-items:center;background:var(--surface-soft);border-radius:7px;color:var(--green)}
.detail-file-name{font-size:10px;font-weight:700;overflow-wrap:anywhere;margin-top:9px;line-height:1.4}
.detail-file-meta{font-size:9px;color:var(--muted);margin-top:4px}
.detail-file-card a{display:inline-block;color:var(--green);font-size:10px;font-weight:700;margin-top:7px;text-decoration:none}
.detail-link-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid var(--line)}
.detail-link-row>div{display:flex;flex-direction:column;gap:5px;min-width:0}
.detail-link-row strong{font-size:11px}
.detail-link-row small{font-size:10px;color:var(--muted);line-height:1.45}
.detail-link-row>span{font-size:10px;color:var(--muted);white-space:nowrap}
.modal:has(.item-detail-root){width:min(1000px,calc(100vw - 36px));max-height:calc(100vh - 40px)}
.modal:has(.item-detail-root) .modal-body{max-height:calc(100vh - 190px);overflow:auto}

/* NOVA PULSE — dark neon visual system */
:root {
  --site-primary: #9B7CFF;
  --site-on-primary: #0C0A17;
  --site-secondary: #20F0DB;
  --site-on-secondary: #08131A;
  --site-background: #0B0D1D;
  --site-on-background: #F4F2FF;
  --surface: #14152A;
  --surface-soft: #1C1D38;
  --text: #F4F2FF;
  --muted: #9B98B8;
  --line: #302E4D;
  --green: #20F0DB;
  --green-soft: #092E32;
  --amber: #FFB55E;
  --amber-soft: #382A24;
  --red: #FF8C9F;
  --red-soft: #3B1D2A;
  --shadow: 0 18px 42px rgba(0, 0, 0, .34);
}
body { background: var(--site-background); color: var(--text); }
.app-root {
  background-color: var(--site-background);
  background-image: radial-gradient(ellipse at 78% -10%, rgba(155,124,255,.18), transparent 38%), radial-gradient(ellipse at 0% 100%, rgba(32,240,219,.055), transparent 34%);
  color: var(--text);
}
.sidebar { background: #090A17; color: #F4F2FF; border-right: 1px solid #2D2948; }
.brand-mark { background: rgba(155,124,255,.18); color: var(--site-secondary); border-color: rgba(155,124,255,.42); box-shadow: 0 0 24px rgba(155,124,255,.12); }
.brand-name { letter-spacing: 1.4px; }
.brand-sub { color: #9B98B8; opacity: 1; }
.nav-label { color: #8984AA; opacity: 1; }
.nav-btn { color: #A6A2C2; }
.nav-btn:hover { background: rgba(155,124,255,.09); color: #F4F2FF; }
.nav-btn.active { background: rgba(32,240,219,.08); color: #F4F2FF; box-shadow: inset 3px 0 0 var(--site-secondary), 0 0 24px rgba(32,240,219,.035); }
.nav-count { background: rgba(155,124,255,.16); color: #D7CEFF; }
.backup-card { background: rgba(155,124,255,.055); border-color: #302E4D; }
.topbar { background: rgba(13,14,32,.94); border-color: var(--line); }
.breadcrumb strong, h1 { color: #F4F2FF; }
.eyebrow, .text-link { color: var(--site-secondary); }
h1 { text-shadow: 0 0 28px rgba(155,124,255,.11); }
.subtitle, .breadcrumb { color: #9B98B8; }
.avatar { background: linear-gradient(135deg, var(--site-secondary), var(--site-primary)); color: #101020; box-shadow: 0 0 22px rgba(32,240,219,.12); }
.panel, .kpi, .catalog-kpi, .catalog-table-shell, .detail-metric, .detail-file-card {
  background: linear-gradient(155deg, #17162E, #101120);
  border-color: var(--line);
  box-shadow: 0 10px 28px rgba(0,0,0,.12);
}
.panel-head, .catalog-head { border-color: var(--line); }
.panel-title, .catalog-title, .detail-section-title { color: #F4F2FF; }
.panel-sub, .catalog-kpi-foot, .item-sub, .detail-note, .detail-file-meta { color: #9B98B8; }
.kpi-icon, .metric-icon, .catalog-kpi-label span { background: rgba(32,240,219,.08); color: var(--site-secondary); }
.trend, .legend i, .detail-file-icon { color: var(--site-secondary); }
.legend span:nth-child(2) i { background: var(--site-primary); }
th { background: #1B1B35; color: #AAA6C8; }
td, .detail-link-row, .detail-fields>div { border-color: var(--line); }
.btn { background: #17182F; color: #EAE7FF; border-color: #343153; }
.btn:hover { filter: brightness(1.12); }
.btn-primary { background: linear-gradient(135deg, #9B7CFF, #20F0DB); border-color: transparent; color: #0C0A17; box-shadow: 0 0 22px rgba(155,124,255,.16); }
.btn-soft { background: rgba(32,240,219,.09); border-color: rgba(32,240,219,.18); color: var(--site-secondary); }
.btn-danger { background: rgba(255,140,159,.09); border-color: rgba(255,140,159,.18); color: var(--red); }
.icon-btn, .date-chip, .search input, .field input, .field select, .field textarea, .doc-line select, .doc-line input {
  background: #101123;
  color: #F4F2FF;
  border-color: #343153;
}
.search input:focus, input:focus, select:focus, textarea:focus { border-color: var(--site-secondary); box-shadow: 0 0 0 3px rgba(32,240,219,.12); }
.app-root input, .app-root select, .app-root textarea, .app-root button { color-scheme: dark; }
.status.ready { color: var(--site-secondary); background: rgba(32,240,219,.09); }
.status.progress { color: var(--amber); background: rgba(255,181,94,.09); }
.status.late { color: var(--red); background: rgba(255,140,159,.09); }
.alert-dot.ok { color: var(--site-secondary); background: rgba(32,240,219,.09); }
.alert-dot.warn { background: rgba(255,181,94,.09); }
.alert-dot.danger { background: rgba(255,140,159,.09); }
.modal-backdrop { background: rgba(4,5,16,.78); backdrop-filter: blur(8px); }
.modal { background: #111225; border-color: #393458; box-shadow: 0 24px 80px rgba(0,0,0,.48), 0 0 28px rgba(155,124,255,.08); }
.modal-head, .modal-foot { border-color: var(--line); }
.modal-title, .field label { color: #F4F2FF; }
.item-detail-tab.active { background: rgba(32,240,219,.08); border-color: rgba(32,240,219,.22); color: var(--site-secondary); }
.doc-line, .detail-file-card { background: #15162C; }
.doc-line .line-remove { background: #17182F; border-color: #343153; }
.catalog-overview .catalog-kpi.attention .catalog-kpi-label span { background: rgba(255,181,94,.1); color: var(--amber); }
.toast { background: linear-gradient(135deg, #9B7CFF, #20F0DB); color: #0C0A17; }
@media (max-width: 800px) {
  .topbar { padding-left: 18px; padding-right: 18px; }
  .content { padding-left: 16px; padding-right: 16px; }
}

let erpDbPromise = null;
function openErpDb(){
  if (!window.indexedDB) return Promise.reject(new Error('IndexedDB недоступна'));
  if (!erpDbPromise) erpDbPromise = new Promise((resolve, reject) => {
    const request = window.indexedDB.open('MiniWorkshopERP', 2);
    request.onupgradeneeded = () => { const db = request.result; if (!db.objectStoreNames.contains('state')) db.createObjectStore('state', { keyPath: 'key' }); if (!db.objectStoreNames.contains('snapshots')) db.createObjectStore('snapshots', { keyPath: 'date' }); };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('Не удалось открыть локальную базу'));
  });
  return erpDbPromise;
}
function readErpDb(){
  return openErpDb().then(db => new Promise((resolve, reject) => {
    const request = db.transaction('state', 'readonly').objectStore('state').get('current');
    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => reject(request.error || new Error('Не удалось прочитать локальную базу'));
  }));
}
function writeErpDb(){
  return openErpDb().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction('state', 'readwrite');
    tx.objectStore('state').put({ key: 'current', savedAt: new Date().toISOString(), data });
    tx.oncomplete = () => resolve(true);
    tx.onerror = () => reject(tx.error || new Error('Не удалось сохранить локальную базу'));
    tx.onabort = () => reject(tx.error || new Error('Сохранение локальной базы отменено'));
  }));
}
function saveDailySnapshot(){
 const date=new Date().toLocaleDateString('en-CA');
 return openErpDb().then(db=>new Promise((resolve,reject)=>{
  const tx=db.transaction('snapshots','readwrite');const store=tx.objectStore('snapshots');
  const req=store.get(date);
  req.onsuccess=()=>{if(!req.result)store.put({date,createdAt:new Date().toISOString(),data:safeClone(data)});};
  tx.oncomplete=()=>{data.settings.lastSnapshotDate=date;writeErpDb().then(()=>resolve(true)).catch(reject);};
  tx.onerror=()=>reject(tx.error||new Error('Не удалось создать локальный снимок'));
 }));
}
function listDailySnapshots(){
 return openErpDb().then(db=>new Promise((resolve,reject)=>{
  const req=db.transaction('snapshots','readonly').objectStore('snapshots').getAll();
  req.onsuccess=()=>resolve((req.result||[]).sort((a,b)=>b.date.localeCompare(a.date)));
  req.onerror=()=>reject(req.error||new Error('Не удалось прочитать историю резервных копий'));
 }));
}
function restoreDailySnapshot(date){

  req.onsuccess=()=>req.result?resolve(req.result):reject(new Error('Копия не найдена'));

}
function removeBinaryPayload(value){
  if (Array.isArray(value)) return value.map(removeBinaryPayload);

  return value;
}

function filterItemsCatalog(){
 const q=(document.getElementById('itemSearch')?.value||'').trim().toLocaleLowerCase('ru');
 const type=document.getElementById('itemTypeFilter')?.value||'';
 const category=document.getElementById('itemCategoryFilter')?.value||'';
 const status=document.getElementById('itemStatusFilter')?.value||'active';
 const stock=document.getElementById('itemStockFilter')?.value||'';
 let visible=0;
 document.querySelectorAll('#itemsCatalogTable tbody tr[data-item-id]').forEach(row=>{
  const item=data.items.find(x=>String(x.id)===row.dataset.itemId);if(!item)return;
  const hay=[item.name,item.article,item.id,item.code,item.barcode,item.category,item.type,item.supplier,item.description].filter(Boolean).join(' ').toLocaleLowerCase('ru');
  const qty=Number(item.qty)||0,min=Number(item.min)||0,res=Number(item.reserved)||0;
  const okQ=!q||hay.includes(q);const okType=!type||item.type===type;const okCat=!category||item.category===category;
  const okStatus=status==='all'||(status==='archive'?item.status==='Архив':item.status!=='Архив');
  const okStock=!stock||(stock==='low'?item.type!=='Услуга'&&qty<min:stock==='zero'?item.type!=='Услуга'&&qty<=0:stock==='available'?item.type!=='Услуга'&&qty-res>0:stock==='service'?item.type==='Услуга':true);
  row.style.display=okQ&&okType&&okCat&&okStatus&&okStock?'':'none';if(row.style.display!=='none')visible++;
 });
 const counter=document.getElementById('itemsVisibleCount');if(counter)counter.textContent=String(visible);const empty=document.getElementById('catalogFilterEmpty');if(empty)empty.hidden=visible>0;
}
function clearItemsFilters(){['itemSearch','itemTypeFilter','itemCategoryFilter'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});const st=document.getElementById('itemStatusFilter');if(st)st.value='active';const sf=document.getElementById('itemStockFilter');if(sf)sf.value='';filterItemsCatalog();}
function openExactBarcode(value){const q=String(value||'').trim();if(!q)return;const found=data.items.find(i=>String(i.barcode||'').trim()===q||String(i.article||'').trim()===q||String(i.code||'').trim()===q);if(found){openItemDetail(found.id);}else{filterItemsCatalog();toastMsg('Точное совпадение не найдено — показаны результаты поиска');}}

 });

function readFilesAsData(fileList){
 const files=Array.from(fileList||[]);
 if(files.some(f=>f.size>8*1024*1024))return Promise.reject(new Error('Размер одного вложения превышает 8 МБ'));
 if(files.reduce((s,f)=>s+f.size,0)>20*1024*1024)return Promise.reject(new Error('Общий размер вложений превышает 20 МБ'));
 return Promise.all(files.map(file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({id:'FILE-'+String(Date.now())+'-'+Math.random().toString(36).slice(2,7),name:file.name,type:file.type||'application/octet-stream',size:file.size,dataUrl:reader.result});reader.onerror=()=>reject(reader.error||new Error('Не удалось прочитать файл'));reader.readAsDataURL(file);}))).catch(error=>{toastMsg(error.message||'Не удалось прочитать файлы');throw error;});
}

function copyItem(id){
 const source=data.items.find(i=>i.id===id);if(!source)return;
 const base=String(source.article||source.id)+'-COPY';let article=base,seq=2;
 while(data.items.some(i=>String(i.article||i.id).toLowerCase()===article.toLowerCase()))article=base+'-'+seq++;
 const codeBase=String(source.code||source.id)+'-COPY';let code=codeBase;seq=2;
 while(data.items.some(i=>String(i.code||'').toLowerCase()===code.toLowerCase()))code=codeBase+'-'+seq++;
 const clone=safeClone(source);clone.id='SKU-'+String(Date.now()).slice(-8);clone.name=source.name+' — копия';clone.article=article;clone.code=code;clone.barcode='';clone.qty=0;clone.reserved=0;clone.status='Активен';clone.prices=[];clone.attachments=(source.attachments||[]).map(f=>({...f}));
 if(data.items.some(i=>i.name.toLowerCase()===clone.name.toLowerCase()))clone.name+=' '+String(Date.now()).slice(-4);
 data.items.push(clone);persist();renderPage();toastMsg('Создана копия с нулевым остатком');openItemModal(clone.id);
}

function archiveItem(id){
 const i=data.items.find(x=>x.id===id);if(!i)return;
 if(i.status==='Архив'){
  if(!confirm(`Восстановить «${i.name}» и разрешить выбор в новых документах?`))return;
  i.status='Активен';persist();renderPage();toastMsg('Позиция восстановлена');return;
 }
 const openOrders=data.purchases.filter(p=>p.name===i.name&&p.status!=='Получен'&&p.status!=='Отменён').length;
 const warnings=[];if(i.type!=='Услуга'&&Number(i.qty)>0)warnings.push(`остаток ${num(i.qty)} ${i.unit}`);if(Number(i.reserved)>0)warnings.push(`резерв ${num(i.reserved)} ${i.unit}`);if(openOrders)warnings.push(`открытые заказы поставщикам: ${openOrders}`);
 const warning=warnings.length?'\n\nВнимание: у позиции есть '+warnings.join('; ')+'. Архивирование не спишет остаток и не удалит историю.':'';
 if(!confirm(`Архивировать «${i.name}»? Новые документы не должны использовать архивную позицию. История и движения сохранятся.${warning}`))return;
 i.status='Архив';persist();renderPage();toastMsg('Позиция архивирована');
}

function normalizedPurchaseStatus(p){
 const raw=String(p.status||'');
 if(['Черновик','Закрыт','Отменён'].includes(raw))return raw;
 if(p.qtyReceivedKnown===false&&['Получен частично','Частично получен'].includes(raw))return 'Частично получен';
 const q=Math.max(0,Number(p.qty)||0),got=Math.max(0,Number(p.qtyReceived)||0);

}

function markPurchaseServiceReceived(lineId){
 const p=data.purchases.find(x=>x.id===lineId);if(!p)return;const left=Math.max(0,(Number(p.qty)||0)-(Number(p.qtyReceived)||0));if(left<=0){toastMsg('Услуга уже принята полностью');return;}
 openModal('Приёмка услуги','Услуга не создаёт движения по складу. Сохраните реквизиты акта или подтверждения оказания.',`<div class="field"><label>Дата приёмки *</label><input name="date" type="date" required value="${localISODate()}"></div><div class="field"><label>Количество к принятию *</label><input name="qty" type="number" min="0.000001" max="${left}" step="any" required value="${left}"></div><div class="field"><label>Акт / документ</label><input name="actNo" placeholder="Номер акта или УПД"></div><div class="field full"><label>Комментарий</label><textarea name="comment" placeholder="Результат оказания услуги, замечания"></textarea></div>`,v=>{const qty=Number(v.qty);if(!Number.isFinite(qty)||qty<=0||qty>left+0.000001){toastMsg(`Количество должно быть больше 0 и не более ${num(left)}`);return false;}p.qtyReceived=(Number(p.qtyReceived)||0)+qty;const acceptance={id:'SVC-'+String(Date.now()),orderNo:p.orderNo||p.id,lineId:p.id,itemId:p.itemId,name:p.name,supplier:p.supplier,date:v.date,qty,unit:p.unit,actNo:v.actNo||'',comment:v.comment||'',amount:(Number(p.amount)||0)*(qty/(Number(p.qty)||1)),status:'Принята'};data.serviceAcceptances.unshift(acceptance);p.history=Array.isArray(p.history)?p.history:[];p.history.push({date:new Date().toISOString(),action:'Принята услуга',reason:acceptance.actNo||acceptance.comment,status:normalizedPurchaseStatus(p),user:'Пользователь'});data.payables.push({id:'AP-'+acceptance.id,supplier:p.supplier,receiptId:acceptance.id,amount:acceptance.amount,status:'Ожидает оплаты',date:v.date,kind:'Услуга',orderNo:p.orderNo||p.id});if(p.qtyReceived>=Number(p.qty)-0.000001)p.status='Получен';else p.status='Частично получен';toastMsg('Услуга принята без изменения складских остатков');},'Подтвердить приёмку');
}

 return (!f.from||String(r.date||'')>=f.from)&&(!f.to||String(r.date||'')<=f.to)&&(!f.supplier||r.supplier===f.supplier)&&(!f.status||r.status===f.status)&&(!f.query||hay.includes(f.query.toLowerCase()));
}

function getReceiptPrice(item,supplier,mode){
 const history=(item.prices||[]).filter(p=>p&&p.supplier&&String(p.supplier).trim().toLowerCase()===String(supplier||'').trim().toLowerCase()).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
 let p=history[0];if(p){const from=p.unit||item.purchaseUnit||item.unit;const to=mode==='purchase'?(item.purchaseUnit||item.unit):item.unit;let value=Number(p.value)||0;if(from!==to){if(from===item.unit&&to===item.purchaseUnit)value*=Number(item.purchaseUnitFactor)||1;else if(from===item.purchaseUnit&&to===item.unit)value/=Number(item.purchaseUnitFactor)||1;}return value;}
 const base=Number(item.purchasePrice??item.cost)||0;return mode==='purchase'?(item.purchaseUnit!==item.unit?base:base):(item.purchaseUnit!==item.unit?base/(Number(item.purchaseUnitFactor)||1):base);
}

 if(item&&price&&!price.dataset.manual&&prev!==next){const factor=Number(item.purchaseUnitFactor)||1;if(prev==='base'&&next==='purchase')price.value=(Number(price.value)||0)*factor;else if(prev==='purchase'&&next==='base')price.value=(Number(price.value)||0)/factor;}
 row.dataset.lastMode=next;updateReceiptTotal();
}

function splitHandlerArgs(source){
 const out=[];let start=0,quote=null,escape=false,depth=0;
 for(let i=0;i<source.length;i++){
  const c=source[i];
  if(quote){if(escape){escape=false;continue;}if(c==='\\'){escape=true;continue;}if(c===quote)quote=null;continue;}
  if(c==='\''||c==='"'||c==='`'){quote=c;continue;}
  if(c==='('||c==='['||c==='{')depth++;
  else if(c===')'||c===']'||c==='}')depth--;
  else if(c===','&&depth===0){out.push(source.slice(start,i).trim());start=i+1;}

 const paid=payable.paidAmount??payable.amountPaid;if(paid!==undefined&&Number.isFinite(Number(paid)))return Math.max(0,amount-Number(paid));

 const body=`<div class="receipt-view-root">
  <div class="receipt-view-meta-grid">
   <div class="receipt-meta-card"><span>№ документа</span><strong>${escapeHtml(r.number||r.id)}</strong></div>
   <div class="receipt-meta-card"><span>Дата</span><strong>${escapeHtml(r.date||'—')}</strong></div>
   <div class="receipt-meta-card"><span>Поставщик</span><strong>${escapeHtml(r.supplier||'—')}</strong></div>
   <div class="receipt-meta-card"><span>Статус</span><strong class="receipt-status-value ${status==='Проведён'?'is-posted':status==='Отменён'?'is-cancelled':'is-draft'}">${escapeHtml(status)}</strong></div>
  </div>
  <div class="receipt-view-meta-grid receipt-view-secondary-grid">
   <div class="receipt-meta-card"><span>Основание</span><strong>${escapeHtml(r.reason||'—')}</strong></div>
   <div class="receipt-meta-card"><span>Заказ поставщику</span><strong>${escapeHtml(r.orderId?((data.purchases.find(p=>p.id===r.orderId)?.orderNo||r.orderId)):'Не привязан')}</strong></div>
  </div>
  <section class="receipt-view-section"><div class="receipt-view-section-head"><div><h3>Состав прихода</h3><p>${(r.lines||[]).length} ${(r.lines||[]).length===1?'позиция':(r.lines||[]).length>1&&((r.lines||[]).length<5)?'позиции':'позиций'}</p></div><span class="receipt-view-section-total">${money(r.total||0)}</span></div>
   <div class="receipt-detail-table-wrap"><table class="receipt-detail-table"><thead><tr><th>№</th><th>Номенклатура</th><th>Количество</th><th>Цена / ед.</th><th>НДС, %</th><th>Сумма НДС</th><th>Всего</th></tr></thead><tbody>${lineRows||'<tr><td colspan="7" class="empty-state">В документе нет строк.</td></tr>'}</tbody></table></div>
   <div class="receipt-detail-totals"><div><span>Сумма без НДС</span><strong>${money(r.subtotal??r.total??0)}</strong></div><div><span>НДС</span><strong>${money(r.vatTotal||0)}</strong></div><div class="receipt-detail-grand-total"><span>Всего к оплате</span><strong>${money(r.total||0)}</strong></div></div>
  </section>
  <section class="receipt-view-section"><div class="receipt-view-section-head"><div><h3>Вложения</h3><p>Файлы, сохранённые вместе с документом</p></div></div><div class="receipt-detail-files">${files}</div></section>
 </div>`;
 // Clear footer actions left over from another modal before opening this document.
 document.querySelectorAll('[data-receipt-detail-action]').forEach(b=>b.remove());
 ['saveDraftReceipt','saveWaitingReceipt'].forEach(k=>{const b=document.getElementById(k);if(b)b.style.display='none';});
 openModal(`Приход ${r.number||r.id}`,`Документ поставки · ${status.toLowerCase()}`,body,()=>true,'Закрыть');
 const modal=document.querySelector('.modal');const grid=document.querySelector('#modalBody > .form-grid');if(grid)grid.classList.add('receipt-detail-layout');if(modal)modal.classList.add('receipt-view-modal');
 const cancelBtn=document.getElementById('cancelModal');if(cancelBtn)cancelBtn.style.display='none';
 const save=document.getElementById('saveModal');save.type='button';save.textContent='Закрыть';save.onclick=closeModal;
 const foot=document.querySelector('.modal-foot');
 const addAction=(label,cls,handler)=>{const b=document.createElement('button');b.type='button';b.className='btn '+cls;b.textContent=label;b.setAttribute('data-receipt-detail-action','1');b.onclick=handler;foot.insertBefore(b,save);};
 if(status==='Черновик'||status==='Ожидание'){
  addAction('Продолжить редактирование','',()=>{closeModal();openReceiptModal(r.id);});
  if(status==='Черновик')addAction('Проверить и провести','btn-primary',()=>{closeModal();openReceiptModal(r.id);});
 }
 if(status==='Проведён')addAction('Отменить приход','btn-danger',()=>{cancelReceipt(r.id);const updated=data.receipts.find(x=>String(x.id)===String(r.id));if(updated&&updated.status==='Отменён')closeModal();});
};

/* Rows are the only entry point; document actions live in the detail window. */
document.addEventListener('click',function(event){
 const row=event.target.closest('tr[data-receipt-id]');
 if(row&&!event.target.closest('button,a,input,select,textarea'))viewReceipt(row.dataset.receiptId);
});
document.addEventListener('keydown',function(event){
 const row=event.target.closest?.('tr[data-receipt-id]');
 if(row&&(event.key==='Enter'||event.key===' ')){event.preventDefault();viewReceipt(row.dataset.receiptId);}
});

/* Restore the standard Cancel button when leaving the read-only receipt modal. */
const _openModalReceiptV52 = openModal;
openModal = function(...args){const b=document.getElementById('cancelModal');if(b)b.style.display='';return _openModalReceiptV52(...args);};
const _openReceiptModalReceiptV52 = openReceiptModal;
openReceiptModal = function(...args){const b=document.getElementById('cancelModal');if(b)b.style.display='';return _openReceiptModalReceiptV52(...args);};
</script>
</body>
</html>
